{% extends "templates/web.html" %}

{% block title %}{{ _("Book Appointment") }}{% endblock %}

{% block script %}
<script src="assets/js/moment-bundle.min.js"></script>
<script src="book_appointment/index.js"></script>
{% endblock %}

{% block page_content %}
<div class="container">
    <!-- title: Book an appointment -->
    <div id="booking-status" class="booking-status" role="status" aria-live="polite"></div>
    <div id="select-date-time">
        <div class="text-center mt-5">
            <h3 id="select-date-time-heading" tabindex="-1">{{ _("Book an appointment") }}</h3>
            <p class="lead text-muted" id="lead-text">{{ _("Select the date and your timezone") }}</p>
        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-6 align-self-center ">
                <div class="row">
                    <div class="col-md m-3 px-0">
                        <label class="control-label text-muted small" for="appointment-date">{{ _("Date") }}</label>
                        <input type="date" oninput="on_date_or_timezone_select()" name="appointment-date"
                            id="appointment-date" class="form-control">
                    </div>
                    <div class="col-md m-3 px-0">
                        <label class="control-label text-muted small" for="appointment-timezone">{{ _("Timezone") }}</label>
                        <select name="appointment-timezone" oninput="on_date_or_timezone_select()" id="appointment-timezone"
                            class="form-control">
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-3" id="timeslot-container" role="group" aria-label="{{ _('Available time slots') }}">

        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-4 mb-3">
                <button type="button" class="btn btn-primary btn-block" id="next-button">{{ _("Next") }}</button>
            </div>
        </div>
    </div>
    <!--Enter Details-->
    <div id="enter-details" class="mb-5">
        <div class="text-center mt-5">
            <h3 id="enter-details-heading" tabindex="-1">{{ _("Add details") }}</h3>
            <p class="lead text-muted" id="selected-slot-text"></p>
        </div>
        <div class="row justify-content-center mt-3">
            <div class="col-md-4 align-items-center">
                <form id="customer-form" onsubmit="event.preventDefault(); submit();">
                    <div class="mt-3">
                        <label class="control-label text-muted small" for="customer_name">{{ _("Your name") }} <span class="text-danger" aria-hidden="true">*</span></label>
                        <input class="form-control" type="text" name="customer_name" id="customer_name"
                            autocomplete="name" aria-required="true" required>
                    </div>
                    <div class="mt-3">
                        <label class="control-label text-muted small" for="customer_number">{{ _("Phone number") }}</label>
                        <input class="form-control" type="tel" name="customer_number" id="customer_number"
                            autocomplete="tel" inputmode="tel">
                    </div>
                    <div class="mt-3">
                        <label class="control-label text-muted small" for="customer_email">{{ _("Email address") }} <span class="text-danger" aria-hidden="true">*</span></label>
                        <input class="form-control" type="email" name="customer_email" id="customer_email"
                            autocomplete="email" aria-required="true" required>
                    </div>
                    <div class="mt-3">
                        <label class="control-label text-muted small" for="customer_notes">{{ _("Notes") }}</label>
                        <textarea class="form-control" name="customer_notes" id="customer_notes" rows="6"></textarea>
                    </div>
                    <div class="row mt-3 " id="submit-button-area">
                        <div class="col-md mt-3 submit-area-back">
                            <button type="button" class="btn btn-secondary btn-block" onclick="initialise_select_date()">{{ _("Go back") }}</button>
                        </div>
                        <div class="col-md mt-3 submit-area-submit">
                            <button type="submit" class="btn btn-primary btn-block" id="submit-button">{{ _("Submit") }}</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
