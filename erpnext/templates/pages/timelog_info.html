{% extends "templates/web.html" %}
{% block title %} {{ doc.name }} {% endblock %}
{% block breadcrumbs %}
<div class="page-breadcrumbs" data-html-block="breadcrumbs">
	<ul class="breadcrumb">
		<li>
			<svg class="icon icon-xs"><use href="#icon-chevron-left"></use></svg>
			<a href="/projects?project={{ doc.project }}">{{ doc.project }}</a>
		</li>
</ul>
</div>
{% endblock %}

{% block page_content %}
	<div class=" col-sm-8 ">
		<h1> {{ doc.name }} </h1>
	</div>

	<div class="page-content-block">
		<div class="row">
			<div class="col-sm-12" style="max-width: 500px;">
				<label for="project" class="control-label text-muted small">{{ _("Project") }}</label>
				<input type="text" class="form-control" id="project" name="project" readonly value="{{ doc.project }}">

				<label for="activity_type" class="control-label text-muted small">{{ _("Activity Type") }}</label>
				<input type="text" class="form-control" id="activity_type" name="activity_type" readonly value="{{ doc.activity_type }}">

				<label for="task" class="control-label text-muted small">{{ _("Task") }}</label>
				<input type="text" class="form-control" id="task" name="task" readonly value="{{ doc.task }}">

				<label for="from_time" class="control-label text-muted small">{{ _("From Time") }}</label>
				<input type="text" class="form-control" id="from_time" name="from_time" readonly value="{{ doc.from_time }}">

				<label for="to_time" class="control-label text-muted small">{{ _("To Time") }}</label>
				<input type="text" class="form-control" id="to_time" name="to_time" readonly value="{{ doc.to_time }}">

				<label for="hours" class="control-label text-muted small">{{ _("Hours") }}</label>
				<input type="text" class="form-control" id="hours" name="hours" readonly value="{{ doc.hours }}">

				<label for="status" class="control-label text-muted small">{{ _("Status") }}</label>
				<input type="text" class="form-control" id="status" name="status" readonly value="{{ _(doc.status) }}">

				<label for="note" class="control-label text-muted small">{{ _("Note") }}</label>
				<textarea class="form-control" id="note" name="note" readonly> {{ doc.note }} </textarea>
			</div>
		</div>
	</div>
{% endblock %}
